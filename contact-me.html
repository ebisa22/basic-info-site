<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Basic Info Site</title>

    <!-- Use the same stylesheet as the other pages -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Shared navigation bar -->
    <header class="navbar">
        <a href="./" class="logo">InfoSite</a>

        <nav>
            <ul class="nav-links">
                <li><a href="./">Home</a></li>
                <li><a href="./about">About</a></li>
                <li><a href="./contact-me" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact page content -->
    <main class="container page-content">
        <p class="eyebrow">LET'S CONNECT</p>
        <h1>Contact Me</h1>
        <p class="description">
            Have a question or want to connect? Here are some ways
            to reach me.
        </p>

        <section class="content-card contact-card">
            <div class="contact-item">
                <h2>Email</h2>
                <p>johnsmith@gmail.com</p>
            </div>

            <div class="contact-item">
                <h2>GitHub</h2>
                <p>
                    <a href="https://github.com/" target="_blank"
                        rel="noopener noreferrer">Visit GitHub</a>
                </p>
            </div>

            <div class="contact-item">
                <h2>Ethiopia</h2>
                <p>Addis Ababa, Ethiopia</p>
            </div>
        </section>

    </main>

    <!-- Shared footer -->
    <footer class="footer">
        <p>&copy; 2026 InfoSite. Built for learning Node.js.</p>
    </footer>
</body>
</html>
